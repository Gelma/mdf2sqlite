[package]
name = "cobi"
version = "0.1.0"
edition = "2021"
description = "Standalone cross-platform Microsoft SQL Server (.MDF) to SQLite3 converter"
authors = ["Andrea Gelmini <andrea.gelmini@gelma.net>"]
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
encoding_rs = "0.8"
memmap2 = "0.9"
rayon = "1.10"
uuid = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
